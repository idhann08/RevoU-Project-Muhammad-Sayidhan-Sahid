<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idhan Waves</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>
<body>
    <button id="theme-toggle" aria-label="Toggle theme"><svg xmlns="http://www.w3.org/2000/svg" width="55" height="55" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></button>

    <header>
        <div class="h-top">
            <h1 id="clock">00:00:00</h1>
            <h2 id="date">Friday, October 9, 2026</h2>
        </div>
        <h1 id="greeting">Good Morning, User.</h1>
        <div class="inputnamasect">
            <input id="inputname" type="text" placeholder="Insert Your Name">
            <input id="submitnama" type="submit" value="Apply">
        </div>
    </header>

    <main class="dashboard">
        <section class="card" id="pomodoro">
            <h2 class="card-title">Focus Timer</h2>
            <div class="pomodoro-display" id="pomodoro-display">25:00</div>
            <div class="pomodoro-controls">
                <button id="pomo-start">Start</button>
                <button id="pomo-stop">Pause</button>
                <button id="pomo-reset">Reset</button>
            </div>
            <div class="pomodoro-set">
                <label for="pomo-duration">Duration (min)</label>
                <input id="pomo-duration" type="number" min="1" max="60" value="25">
            </div>
        </section>

        
        <section class="card" id="todo">
            <h2 class="card-title">To-Do List</h2>
            <div class="todo-input">
                <input id="todo-input" type="text" placeholder="Add a new task...">
                <button id="todo-add">Add</button>
            </div>
            <ul id="todo-list"></ul>
        </section>

        
        <section class="card" id="quicklinks">
            <h2 class="card-title">Quick Links</h2>
            <div class="ql-input">
                <input id="ql-label" type="text" placeholder="Label">
                <input id="ql-url" type="url" placeholder="https://...">
                <button id="ql-add">Add</button>
            </div>
            <ul id="ql-list"></ul>
        </section>
    </main>

    <script src="./JS/index.js"></script>
</body>
</html>
